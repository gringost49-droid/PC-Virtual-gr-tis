<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual PC</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    overflow: hidden;
    background: #111;
}

#desktop {
    width: 100vw;
    height: 100vh;
    background: linear-gradient(135deg, #172554, #312e81, #111827);
    position: relative;
    overflow: hidden;
}

/* Ícones */
.icons {
    position: absolute;
    top: 20px;
    left: 20px;
    display: flex;
    flex-direction: column;
    gap: 22px;
}

.icon {
    width: 75px;
    text-align: center;
    color: white;
    cursor: pointer;
    user-select: none;
}

.icon .emoji {
    font-size: 38px;
    display: block;
}

.icon span {
    font-size: 13px;
    text-shadow: 1px 1px 3px black;
}

/* Barra */
#taskbar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 55px;
    background: rgba(15,15,20,.92);
    backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    padding: 0 12px;
    color: white;
}

#start {
    font-size: 26px;
    cursor: pointer;
    padding: 8px 15px;
}

#clock {
    margin-left: auto;
    font-size: 14px;
}

/* Menu iniciar */
#startMenu {
    display: none;
    position: absolute;
    bottom: 60px;
    left: 10px;
    width: 300px;
    background: rgba(25,25,30,.97);
    border-radius: 12px;
    padding: 18px;
    color: white;
    box-shadow: 0 10px 40px #000;
}

#startMenu h2 {
    margin-bottom: 15px;
}

.appButton {
    width: 100%;
    border: 0;
    background: #292932;
    color: white;
    padding: 13px;
    margin: 5px 0;
    border-radius: 8px;
    text-align: left;
    cursor: pointer;
}

.appButton:hover {
    background: #3f3f4b;
}

/* Janelas */
.window {
    display: none;
    position: absolute;
    top: 12%;
    left: 15%;
    width: 70%;
    height: 65%;
    background: #f5f5f5;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
}

.titlebar {
    height: 42px;
    background: #202020;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 12px;
    cursor: move;
}

.titlebar span {
    flex: 1;
}

.close {
    cursor: pointer;
    font-size: 20px;
    padding: 5px 10px;
}

.content {
    height: calc(100% - 42px);
    padding: 20px;
    overflow: auto;
}

/* Navegador */
.browserBar {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

.browserBar input {
    flex: 1;
    padding: 10px;
    border: 1px solid #aaa;
    border-radius: 6px;
}

.browserBar button {
    padding: 10px 15px;
}

#browserPage {
    width: 100%;
    height: 80%;
    border: 1px solid #aaa;
}

/* Terminal */
#terminal {
    background: #050505;
    color: #00ff66;
    height: 100%;
    padding: 15px;
    font-family: monospace;
    overflow: auto;
}

#terminalInput {
    background: transparent;
    border: none;
    outline: none;
    color: #00ff66;
    font-family: monospace;
    width: 80%;
}
</style>
</head>

<body>

<div id="desktop">

    <div class="icons">

        <div class="icon" onclick="openWindow('browser')">
            <span class="emoji">🌐</span>
            <span>Navegador</span>
        </div>

        <div class="icon" onclick="openWindow('files')">
            <span class="emoji">📁</span>
            <span>Arquivos</span>
        </div>

        <div class="icon" onclick="openWindow('terminal')">
            <span class="emoji">💻</span>
            <span>Terminal</span>
        </div>

    </div>

    <!-- Navegador -->
    <div class="window" id="browser">
        <div class="titlebar">
            <span>🌐 Navegador</span>
            <div class="close" onclick="closeWindow('browser')">✕</div>
        </div>

        <div class="content">

            <div class="browserBar">
                <input id="url" value="https://www.google.com">
                <button onclick="go()">Ir</button>
            </div>

            <iframe id="browserPage"></iframe>

        </div>
    </div>

    <!-- Arquivos -->
    <div class="window" id="files">
        <div class="titlebar">
            <span>📁 Explorador de Arquivos</span>
            <div class="close" onclick="closeWindow('files')">✕</div>
        </div>

        <div class="content">

            <h2>Este PC</h2>
            <br>

            <p>💾 Disco Local (C:)</p>
            <br>

            <p>📂 Documentos</p>
            <p>📂 Downloads</p>
            <p>📂 Imagens</p>
            <p>📂 Jogos</p>

        </div>
    </div>

    <!-- Terminal -->
    <div class="window" id="terminal">

        <div class="titlebar">
            <span>💻 Terminal</span>
            <div class="close" onclick="closeWindow('terminal')">✕</div>
        </div>

        <div id="terminal" class="content" style="background:#050505;color:#00ff66">

            <div id="terminalOutput">
                Virtual PC Terminal<br>
                Digite "help" para ver os comandos.<br><br>
            </div>

            <span>PC&gt; </span>

            <input
                id="terminalInput"
                autocomplete="off"
                onkeydown="terminalCommand(event)"
            >

        </div>

    </div>

    <!-- Menu -->
    <div id="startMenu">

        <h2>🪟 Virtual PC</h2>

        <button class="appButton" onclick="openWindow('browser')">
            🌐 Navegador
        </button>

        <button class="appButton" onclick="openWindow('files')">
            📁 Arquivos
        </button>

        <button class="appButton" onclick="openWindow('terminal')">
            💻 Terminal
        </button>

        <button class="appButton" onclick="aboutPC()">
            ⚙️ Sobre este PC
        </button>

    </div>

    <!-- Barra -->
    <div id="taskbar">

        <div id="start" onclick="toggleStart()">⊞</div>

        <div id="clock"></div>

    </div>

</div>

<script>

/* Relógio */

function updateClock() {

    const now = new Date();

    document.getElementById("clock").innerText =
        now.toLocaleTimeString("pt-BR", {
            hour: "2-digit",
            minute: "2-digit"
        });
}

setInterval(updateClock, 1000);
updateClock();


/* Janelas */

function openWindow(id) {

    document.getElementById(id).style.display = "block";

    document.getElementById("startMenu").style.display = "none";
}

function closeWindow(id) {

    document.getElementById(id).style.display = "none";
}


/* Menu iniciar */

function toggleStart() {

    const menu = document.getElementById("startMenu");

    menu.style.display =
        menu.style.display === "block"
        ? "none"
        : "block";
}


/* Navegador */

function go() {

    let url = document.getElementById("url").value;

    if (!url.startsWith("http://") &&
        !url.startsWith("https://")) {

        url = "https://" + url;
    }

    document.getElementById("browserPage").src = url;
}


/* Terminal */

function terminalCommand(event) {

    if (event.key !== "Enter") return;

    const input =
        document.getElementById("terminalInput");

    const command =
        input.value.trim().toLowerCase();

    const output =
        document.getElementById("terminalOutput");

    if (command === "help") {

        output.innerHTML +=
            "help - mostra os
